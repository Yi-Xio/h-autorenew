name: Woiden Auto Renew

on:
  schedule:
    - cron: '32 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 这里只生成数字序号；各账号恢复自己的缓存后独立预筛。
  build-matrix:
    if: github.ref == 'refs/heads/master'
    environment: renewal
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 生成账号矩阵
        id: matrix
        env:
          BATCH: ${{ secrets.BATCH }}
        run: python3 -m scripts.workflow matrix woiden

  account:
    name: 'Woiden 账号 #${{ matrix.index }}'
    needs: build-matrix
    if: github.ref == 'refs/heads/master'
    environment: renewal
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # 每个账号独立一组，矩阵 job 并行执行，同账号跨平台运行也防重叠。
      group: renewal-account-${{ matrix.index }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    env:
      BATCH_ACCOUNT_INDEX: ${{ matrix.index }}
      DEBUG_FLAG: '0'
      PUBLIC_SUMMARY_DEFERRED: '1'
      SKIP_DAYS: '2'
      WOIDEN_MIN_VALID_DAYS: '2'
      # 续期重试次数（外层）
      MAX_RENEW_RETRIES: '5'
      # IP 被封时切换 WARP 重试次数（内层）
      MAX_WARP_RETRIES: '10'
      # 登录重试次数
      MAX_LOGIN_RETRIES: '1'
    steps:
      - name: 检出仓库
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 准备账号缓存
        id: cache-key
        env:
          BATCH: ${{ secrets.BATCH }}
        run: python3 -m scripts.workflow setup-cache woiden

      # 每轮都恢复本账号缓存，全部跳过时也保持访问。
      - name: 恢复账号状态
        id: restore-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        timeout-minutes: 2
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
        with:
          path: output/renewal-state.json
          key: ${{ steps.cache-key.outputs.cache_key }}
          restore-keys: ${{ steps.cache-key.outputs.cache_prefix }}

      - name: 判断本账号是否需要运行
        id: decide
        env:
          BATCH: ${{ secrets.BATCH }}
          CACHE_RESTORE_OUTCOME: ${{ steps.restore-cache.outcome }}
        run: python3 -m scripts.workflow check woiden

      - name: 通知跳过的账号
        id: notify-skipped
        if: steps.decide.outputs.should_run == 'false'
        env:
          BATCH: ${{ secrets.BATCH }}
          DAYS_LEFT: ${{ steps.decide.outputs.days_left }}
        run: python3 -m scripts.workflow notify-skipped woiden

      - name: 设置 Python
        id: setup-python
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 缓存 Chromium apt 包
        if: steps.decide.outputs.should_run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/woiden-apt/*.deb
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-v1

      - name: 安装依赖
        id: install-dependencies
        if: steps.decide.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/.cache/woiden-apt/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/woiden-apt" \
            install -y xvfb chromium ffmpeg unzip curl wget jq ca-certificates
          pip install --upgrade pip
          pip install -r requirements.txt -q
          python3 -c 'import speech_recognition, pydub, audioop; print("语音依赖导入成功")'

      - name: 启用 WARP
        id: warp
        if: steps.decide.outputs.should_run == 'true'
        run: bash scripts/setup_warp.sh

      - name: 安装代理
        id: proxy
        if: steps.decide.outputs.should_run == 'true'
        env:
          PROXY_CONTENT: ${{ secrets.PROXY_URL }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo 'stage=proxy result=direct'
            exit 0
          fi
          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo 'stage=proxy result=installed'

      - name: 执行续期
        if: steps.decide.outputs.should_run == 'true'
        id: renew
        env:
          BATCH: ${{ secrets.BATCH }}
          PROXY_CONTENT: ${{ secrets.PROXY_URL }}
          SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
          # 2captcha API Key 可选，只在续期步骤中提供。
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
        run: python3 -m scripts.actions_runtime woiden

      # 只保存本轮可靠结果，失败或待核实时仍可保存已知日期。
      # 不同账号使用独立 key；保存失败时远端旧快照继续保留。
      - name: 准备账户状态
        id: state
        if: always() && !cancelled() && (steps.renew.outcome == 'success' || steps.renew.outcome == 'failure')
        env:
          BATCH: ${{ secrets.BATCH }}
          CACHE_RESTORE_OUTCOME: ${{ steps.restore-cache.outcome }}
        run: python3 -m scripts.workflow prepare-state woiden

      - name: 保存账号状态缓存
        id: save-cache
        if: always() && !cancelled() && steps.state.outputs.changed == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: output/renewal-state.json
          key: ${{ steps.cache-key.outputs.cache_key }}

      # 精确查询本轮新 key，不下载快照，也不把 save 步骤绿色状态当作上传成功。
      - name: 核实本轮缓存
        id: verify-cache
        if: always() && !cancelled() && steps.state.outputs.changed == 'true' && (steps.save-cache.outcome == 'success' || steps.save-cache.outcome == 'failure')
        uses: actions/cache/restore@v6
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: output/renewal-state.json
          key: ${{ steps.cache-key.outputs.cache_key }}
          lookup-only: true

      - name: 生成运行摘要
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CACHE_KEY_OUTCOME: ${{ steps.cache-key.outcome }}
          CHECK_OUTCOME: ${{ steps.decide.outcome }}
          SHOULD_RUN: ${{ steps.decide.outputs.should_run }}
          DAYS_LEFT: ${{ steps.decide.outputs.days_left }}
          CACHE_STATUS: ${{ steps.decide.outputs.cache_status }}
          NOTIFY_STATUS: ${{ steps.notify-skipped.outputs.notification_status }}
          NOTIFY_OUTCOME: ${{ steps.notify-skipped.outcome }}
          PYTHON_OUTCOME: ${{ steps.setup-python.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.install-dependencies.outcome }}
          WARP_OUTCOME: ${{ steps.warp.outcome }}
          PROXY_OUTCOME: ${{ steps.proxy.outcome }}
          RENEW_OUTCOME: ${{ steps.renew.outcome }}
          STATE_OUTCOME: ${{ steps.state.outcome }}
          STATE_STATUS: ${{ steps.state.outputs.state_status }}
          SAVE_OUTCOME: ${{ steps.save-cache.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify-cache.outcome }}
          VERIFY_HIT: ${{ steps.verify-cache.outputs.cache-hit }}
          JOB_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          if ! python3 -m scripts.workflow summary woiden 2>/dev/null; then
            printf '%s\n' '### Woiden · 运行摘要' '' '**未能生成详细摘要，请查看失败步骤。**' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 断开 WARP
        if: always()
        run: sudo warp-cli --accept-tos disconnect >/dev/null 2>&1 || true

      - name: 🧹 清理旧的工作流运行记录
        if: always() && matrix.index == 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          current_run="${{ github.run_id }}"
          cutoff_epoch=$(date -d '24 hours ago' +%s)
          runs=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow="woiden-renew.yml" \
            --limit=100 \
            --json databaseId,createdAt,status,conclusion \
            --jq '.[] | [.databaseId, .createdAt, .status, (.conclusion // "")] | @tsv' 2>/dev/null)
          if [ -z "$runs" ]; then
            echo "没有找到可清理的运行记录"
            exit 0
          fi
          while IFS=$'\t' read -r run_id created_at status conclusion; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$current_run" ]; then
              echo "保留当前运行记录: $run_id"
              continue
            fi
            created_epoch=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            if [ "$created_epoch" -ge "$cutoff_epoch" ]; then
              echo "保留 24 小时内记录: $run_id ($created_at)"
              continue
            fi
            if [ "$status" != "completed" ]; then
              echo "保留未完成记录: $run_id (status=$status)"
              continue
            fi
            echo "删除超过 24 小时的已完成记录: $run_id (created=$created_at, conclusion=$conclusion)"
            gh run delete "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done <<< "$runs"
          echo "清理完成：保留最近 24 小时记录及所有未完成记录"
